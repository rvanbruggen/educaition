{% assign item = include.item %}
<p class="badges">
  {% for t in item.niveau %}<span class="badge badge-niveau">{{ t }}</span>{% endfor %}
  {% for t in item.vak %}<span class="badge badge-vak">{{ t }}</span>{% endfor %}
  {% for t in item.thema %}<span class="badge badge-thema">{{ t }}</span>{% endfor %}
  {% for t in item.regio %}<span class="badge badge-regio">{{ t }}</span>{% endfor %}
  {% if item.type %}<span class="badge badge-type">{{ item.type }}</span>{% endif %}
</p>
