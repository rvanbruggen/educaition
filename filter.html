---
layout: default
title: Artikels
permalink: /filter/
---
<h1>Artikels</h1>
<p>Zoek in alle artikels en filter op niveau, vak, thema, regio of contenttype.</p>

<div class="zoekbalk">
  <input type="search" id="f-zoek" placeholder="Zoek op trefwoord, bv. 'plagiaat' of 'AI Act'…"
         autocomplete="off" aria-label="Zoek in alle artikels">
</div>

<div class="filters">
  <div>
    <label for="f-niveau">Niveau</label>
    <select id="f-niveau"><option value="">Alle</option>
      {% for t in site.data.tags.niveau %}
      <option value="{{ t.slug }}">{{ t.naam }}</option>
      {% for k in t.kinderen %}<option value="{{ k.slug }}">— {{ k.naam }}</option>{% endfor %}
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="f-vak">Vak</label>
    <select id="f-vak"><option value="">Alle</option>
      {% for t in site.data.tags.vak %}
      <option value="{{ t.slug }}">{{ t.naam }}</option>
      {% for k in t.kinderen %}<option value="{{ k.slug }}">— {{ k.naam }}</option>{% endfor %}
      {% endfor %}
    </select>
  </div>
  <div>
    <label for="f-thema">Thema</label>
    <select id="f-thema"><option value="">Alle</option>
      {% for t in site.data.tags.thema %}<option value="{{ t.slug }}">{{ t.naam }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label for="f-regio">Regio</label>
    <select id="f-regio"><option value="">Alle</option>
      {% for t in site.data.tags.regio %}<option value="{{ t.slug }}">{{ t.naam }}</option>{% endfor %}
    </select>
  </div>
  <div>
    <label for="f-type">Type</label>
    <select id="f-type"><option value="">Alle</option>
      <option value="digest*">Alle samenvattingen</option>
      {% for t in site.data.tags.type %}<option value="{{ t.slug }}">{{ t.naam }}</option>{% endfor %}
    </select>
  </div>
</div>

<p id="resultaat-teller"></p>
<ul class="post-list" id="resultaten"></ul>

<script>
(function () {
  var data = [];
  var zoekEl = document.getElementById('f-zoek');
  var selects = ['niveau', 'vak', 'thema', 'regio', 'type'].map(function (f) {
    return { facet: f, el: document.getElementById('f-' + f) };
  });

  function normalize(s) {
    return (s || '').toLowerCase()
      .normalize('NFD').replace(/[̀-ͯ]/g, ''); // é→e, ë→e
  }

  function matchesFacets(item) {
    return selects.every(function (s) {
      var v = s.el.value;
      if (!v) return true;
      var field = item[s.facet];
      // waarde met '*' = prefix-match (bv. 'digest*' matcht digest én digest-internationaal)
      if (v.slice(-1) === '*') {
        var prefix = v.slice(0, -1);
        if (Array.isArray(field)) {
          return field.some(function (f) { return f.indexOf(prefix) === 0; });
        }
        return typeof field === 'string' && field.indexOf(prefix) === 0;
      }
      if (Array.isArray(field)) return field.indexOf(v) !== -1;
      return field === v;
    });
  }

  function matchesQuery(item, terms) {
    if (!terms.length) return true;
    var haystack = normalize(
      item.title + ' ' + (item.excerpt || '') + ' ' + (item.content || '') + ' ' +
      [].concat(item.niveau || [], item.vak || [], item.thema || [],
                item.regio || [], item.doelgroep || [], item.type || []).join(' ')
    );
    return terms.every(function (t) { return haystack.indexOf(t) !== -1; });
  }

  function snippet(item, terms) {
    var text = item.content || item.excerpt || '';
    if (!terms.length) return (item.excerpt || '');
    var idx = normalize(text).indexOf(terms[0]);
    if (idx === -1) return (item.excerpt || '');
    var start = Math.max(0, idx - 70);
    var frag = (start > 0 ? '…' : '') +
      text.slice(start, idx + terms[0].length + 110) + '…';
    return frag;
  }

  function highlight(html, terms) {
    if (!terms.length) return html;
    terms.forEach(function (t) {
      var re = new RegExp('(' + t.replace(/[.*+?^${}()|[\]\\]/g, '\\$&') + ')', 'gi');
      html = html.replace(re, '<mark>$1</mark>');
    });
    return html;
  }

  function render() {
    var terms = normalize(zoekEl.value).split(/\s+/).filter(Boolean);
    var hits = data.filter(function (p) {
      return matchesFacets(p) && matchesQuery(p, terms);
    });
    document.getElementById('resultaat-teller').textContent =
      hits.length + ' artikel' + (hits.length === 1 ? '' : 's') + ' gevonden';
    document.getElementById('resultaten').innerHTML = hits.map(function (p) {
      var badges = ['niveau', 'vak', 'thema', 'regio'].map(function (f) {
        return (p[f] || []).map(function (t) {
          return '<span class="badge badge-' + f + '">' + t + '</span>';
        }).join(' ');
      }).filter(Boolean).join(' ');
      if (p.type) badges += ' <span class="badge badge-type">' + p.type + '</span>';
      var thumb = p.image
        ? '<a href="' + p.url + '" class="post-thumb-link" tabindex="-1" aria-hidden="true">' +
          '<img class="post-thumb" src="' + p.image.replace(/&/g, '&amp;').replace(/"/g, '&quot;') + '" alt="" ' +
          'loading="lazy" referrerpolicy="no-referrer" onerror="this.parentNode.remove()"></a>'
        : '';
      return '<li>' + thumb + '<h3><a href="' + p.url + '">' + highlight(p.title, terms) + '</a></h3>' +
        '<p class="meta">' + p.date + '</p>' +
        '<p class="badges">' + badges + '</p>' +
        '<p>' + highlight(snippet(p, terms), terms) + '</p></li>';
    }).join('');
    // hou de zoekterm in de URL zodat je resultaten kunt delen
    var params = new URLSearchParams(window.location.search);
    if (zoekEl.value) { params.set('q', zoekEl.value); } else { params.delete('q'); }
    var qs = params.toString();
    history.replaceState(null, '', window.location.pathname + (qs ? '?' + qs : ''));
  }

  fetch('{{ "/search.json" | relative_url }}')
    .then(function (r) { return r.json(); })
    .then(function (json) {
      data = json;
      var q = new URLSearchParams(window.location.search).get('q');
      if (q) zoekEl.value = q;
      selects.forEach(function (s) { s.el.addEventListener('change', render); });
      zoekEl.addEventListener('input', render);
      render();
      if (q) zoekEl.focus();
    });
})();
</script>
