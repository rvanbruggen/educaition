title: EducAItion
description: >-
  AI en onderwijs in Vlaanderen — nieuws, best practices en regelgeving,
  wekelijks samengevat en doorzoekbaar per niveau, vak en thema.
lang: nl
timezone: Europe/Brussels
version: "0.5.1"
url: "https://www.educaition.today"
baseurl: ""

# GitHub Pages-veilige plugins (whitelist)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
permalink: /:year/:month/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      niveau: []
      vak: [vakoverschrijdend]
      thema: []
      regio: [vlaanderen]
      type: nieuws
      doelgroep: [leerkracht]

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
