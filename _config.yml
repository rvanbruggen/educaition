title: EducAItion
description: >-
  Dé hub voor AI en onderwijs in Vlaanderen en de wereld — nieuws, onderzoek,
  media en regelgeving, doorzoekbaar per niveau, vak en thema.
lang: nl_BE
timezone: Europe/Brussels
author: Rik Van Bruggen
# jekyll-seo-tag: logo voor JSON-LD Organization + sociale profielen
logo: /assets/img/logo-512.png
social:
  name: EducAItion
  links:
    - https://github.com/rvanbruggen/educaition
version: "0.8.0"
url: "https://www.educaition.today"
baseurl: ""

# GitHub Pages-veilige plugins (whitelist)
plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

markdown: kramdown
permalink: /:year/:month/:title/

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
      niveau: []
      vak: [vakoverschrijdend]
      thema: []
      regio: [vlaanderen]
      type: nieuws
      doelgroep: [leerkracht]
  # Standaard og:image voor pagina's (niet voor posts: index.html/filter.html
  # gebruiken post.image voor thumbnails, een default zou daar opduiken)
  - scope:
      path: ""
      type: pages
    values:
      image: /assets/img/og-default.png

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE
  - vendor
